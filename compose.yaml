# StockSync local development stack.
#   docker compose up --build -d      build and start everything; open http://localhost:8080
#   docker compose ps                 status (db, api, frontend "healthy"; migrate "exited (0)")
#   docker compose logs -f api        follow API logs
#   docker compose down               stop; the db-data volume (your data) is kept
#   docker compose down -v            stop AND delete data (re-runs database/init/*.sql next start)
name: stocksync

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksync}
      POSTGRES_DB: ${POSTGRES_DB:-stocksync}
      # Read from a Docker secret file instead of a plain environment variable.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/...,
      # so the volume is mounted at /var/lib/postgresql (not .../data).
      - db-data:/var/lib/postgresql
      # Schema + seed, run once on first start with an empty volume.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to localhost only, on 5433 to avoid clashing with any local PostgreSQL.
      # Lets you connect with a GUI tool (TablePlus, pgAdmin) during development.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # One-off job: apply database migrations (backend/migrations), then exit.
  # The API starts only after it finished successfully.
  migrate:
    build: ./backend                  # same image as the api service
    image: stocksync-api:dev
    command: ["node", "src/migrate.js"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-stocksync}
      DB_NAME: ${POSTGRES_DB:-stocksync}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  api:
    build: ./backend
    image: stocksync-api:dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEPLOY_ENV: docker-compose
      TRUST_PROXY_HOPS: 1               # nginx sits in front: use the real client IP for rate limiting
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      DB_HOST: db                       # the Compose service name is the hostname
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-stocksync}
      DB_NAME: ${POSTGRES_DB:-stocksync}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    secrets:
      - db_password
      - jwt_secret
    ports:
      # Localhost only: users reach the API through nginx; this port is just for
      # tests and curl on this machine.
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy      # wait for pg_isready, not just "container started"
      migrate:
        condition: service_completed_successfully   # schema is up to date first
    healthcheck:
      # node:24-slim has no curl; Node 24 has fetch built in.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    image: stocksync-frontend:dev
    environment:
      API_UPSTREAM: http://api:3000    # nginx forwards /api/ to the api service
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
