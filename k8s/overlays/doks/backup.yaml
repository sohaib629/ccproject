# =============================================================================
# Backup and recovery (DigitalOcean only: backups go to Spaces object storage).
#
#   CronJob db-backup        nightly pg_dump -> Spaces, keeps the newest 7
#   CronJob db-restore-test  SUSPENDED: never runs on a schedule; started on
#                            demand to restore the latest backup into a separate
#                            database and verify it (see docs/operations.md)
#
# Run either one now:
#   kubectl -n stocksync create job backup-now-$(date +%s)  --from=cronjob/db-backup
#   kubectl -n stocksync create job restore-test-$(date +%s) --from=cronjob/db-restore-test
#
# The PVC keeps data across pod restarts, but it is NOT a backup: deleting the
# volume, the cluster or the namespace (or a bad migration) would lose
# everything. These copies live outside the cluster.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-config
data:
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: stocksync
  PGDATABASE: stocksync
  S3_ENDPOINT: https://nyc3.digitaloceanspaces.com
  S3_BUCKET: stocksync-backups      # bucket names are global; change if taken
  S3_PREFIX: postgres
  KEEP: "14"                               # nightly + one before each deploy (CD)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels: { app.kubernetes.io/name: db-backup }
spec:
  schedule: "0 3 * * *"                    # 03:00 every night...
  timeZone: America/Toronto                # ...Toronto time
  concurrencyPolicy: Forbid                # never two backups at once
  startingDeadlineSeconds: 3600            # run late (up to 1 h) rather than skip
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2                      # retry a failed backup twice
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800      # clean up finished Jobs after 7 days
      template:
        metadata:
          labels: { app.kubernetes.io/name: db-backup, app.kubernetes.io/part-of: stocksync }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: [{ name: docr }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70                  # "postgres" user of the alpine image
            runAsGroup: 70
            fsGroup: 70                    # can read the 0440 secret files
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: stocksync-backup      # registry + tag set by k8s/deploy.sh
              args: ["/usr/local/bin/backup.sh"]
              envFrom:
                - configMapRef: { name: backup-config }
              env:
                - { name: DB_PASSWORD_FILE, value: /run/secrets/db/db_password }
              volumeMounts:
                - { name: db-password, mountPath: /run/secrets/db, readOnly: true }
                - { name: spaces, mountPath: /run/secrets/spaces, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: db-password
              secret:
                secretName: stocksync-secrets
                items: [{ key: db_password, path: db_password }]   # not the JWT key
                defaultMode: 0440
            - name: spaces
              secret:
                secretName: spaces-credentials                     # from k8s/bootstrap.sh
                defaultMode: 0440
            - name: tmp
              emptyDir: { sizeLimit: 2Gi }                         # dump is staged here
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-restore-test
  labels: { app.kubernetes.io/name: db-restore-test }
spec:
  schedule: "0 4 * * 0"                    # required field; unused while suspended
  timeZone: America/Toronto
  suspend: true                            # on demand only: kubectl create job --from=...
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0                      # a failed verification should stay failed
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: { app.kubernetes.io/name: db-restore-test, app.kubernetes.io/part-of: stocksync }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: [{ name: docr }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: restore-test
              image: stocksync-backup
              args: ["/usr/local/bin/restore-test.sh"]
              envFrom:
                - configMapRef: { name: backup-config }
              env:
                - { name: RESTORE_DB, value: stocksync_restore }   # separate database
                - { name: DB_PASSWORD_FILE, value: /run/secrets/db/db_password }
              volumeMounts:
                - { name: db-password, mountPath: /run/secrets/db, readOnly: true }
                - { name: spaces, mountPath: /run/secrets/spaces, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: db-password
              secret:
                secretName: stocksync-secrets
                items: [{ key: db_password, path: db_password }]
                defaultMode: 0440
            - name: spaces
              secret:
                secretName: spaces-credentials
                defaultMode: 0440
            - name: tmp
              emptyDir: { sizeLimit: 2Gi }
