# minikube: images are built on the Mac and loaded into the cluster with
# `minikube image load`, so Kubernetes must never try to pull them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: stocksync-api
    newName: stocksync-api
    newTag: dev
  - name: stocksync-frontend
    newName: stocksync-frontend
    newTag: dev
patches:
  - target: { kind: ConfigMap, name: api-config }
    patch: |-
      - op: replace
        path: /data/DEPLOY_ENV
        value: minikube
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
