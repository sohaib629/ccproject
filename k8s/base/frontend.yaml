# =============================================================================
# StockSync frontend: nginx serving the built React app, and forwarding /api/
# to the "api" Service. On DigitalOcean (Day 5) the Gateway sends "/" here and
# "/api" straight to the API Service.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: stocksync }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: stocksync }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: stocksync }
    spec:
      # None of our pods call the Kubernetes API, so do not mount a service-account
      # token. Also required for the /run/secrets mount: in Debian-based images
      # /var/run -> /run, and the token mount (/var/run/secrets/kubernetes.io/...)
      # would otherwise collide with our read-only secret volume.
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: frontend }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # the "nginx" user of nginx-unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: stocksync-frontend   # tag set by the overlay
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://api:3000  # the API Service, by DNS name
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
