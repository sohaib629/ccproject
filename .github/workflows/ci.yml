# Continuous Integration: runs on every pull request and every push to main.
# A pull request can only be merged when all five jobs are green (branch
# protection). After a merge, a green run on main triggers CD (cd.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A throwaway PostgreSQL 18 just for this job. The test harness creates and
    # resets its own stocksync_test database inside it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stocksync
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: stocksync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocksync"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc          # same Node version as local and Docker
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run test suite
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: stocksync
          DB_PASSWORD: ci-only-password
          TEST_DB_NAME: stocksync_test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  k8s-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Render every overlay with Kustomize and validate each object against the
      # official Kubernetes API schemas, so a broken manifest fails the PR.
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      # Built-in kinds use the official schemas; CRD kinds (Gateway, HTTPRoute,
      # Certificate, ClusterIssuer) use the community CRDs-catalog schemas.
      - name: Render and validate
        env:
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          validate() { kubeconform -strict -summary -kubernetes-version 1.34.0 \
                         -schema-location default -schema-location "$CRD_SCHEMAS" "$@"; }
          for overlay in k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | validate -
            echo "::endgroup::"
          done
          validate k8s/cluster/

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      # Build for linux/amd64 (the DigitalOcean node architecture) to prove the
      # images build there. Nothing is pushed here; CD (cd.yml) pushes after merge.
      - name: Build API image
        run: docker build --platform linux/amd64 -t stocksync-api:ci ./backend
      - name: Build frontend image
        run: docker build --platform linux/amd64 -t stocksync-frontend:ci ./frontend
      - name: Build backup image
        run: docker build --platform linux/amd64 -t stocksync-backup:ci ./backup
      - name: Check the backup image has its tools and scripts
        run: |
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash stocksync-backup:ci -c \
            'pg_dump --version && aws --version && for f in /usr/local/bin/backup*.sh /usr/local/bin/restore-test.sh; do bash -n "$f"; done && echo "backup image OK"'
      - name: Check the API image loads its code
        run: |
          docker run --rm --platform linux/amd64 \
            -e DB_PASSWORD=unused -e JWT_SECRET=ci-check-0123456789abcdef0123456789 \
            --entrypoint node stocksync-api:ci \
            -e "require('./src/app.js').createApp(); const n = require('./src/migrate.js').migrationFiles().length; if (n < 2) throw new Error('migrations missing from image'); console.log('API image OK,', n, 'migrations')"

  # Scan the three images for known vulnerabilities (CVEs) with Trivy.
  # Fails only on CRITICAL issues that already have a fix (upgrading would solve
  # them); everything HIGH or CRITICAL is listed in the job summary. Justified,
  # temporary exceptions go in .trivyignore (one CVE id per line, with a reason).
  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY: >-
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
        -v ${{ github.workspace }}:/src:ro -v trivy-cache:/root/.cache/trivy
        aquasec/trivy:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build --platform linux/amd64 -t stocksync-api:scan ./backend
          docker build --platform linux/amd64 -t stocksync-frontend:scan ./frontend
          docker build --platform linux/amd64 -t stocksync-backup:scan ./backup
      - name: Report HIGH and CRITICAL vulnerabilities (job summary)
        run: |
          for img in api frontend backup; do
            $TRIVY image --quiet --scanners vuln --severity HIGH,CRITICAL --ignorefile /src/.trivyignore \
              --format table "stocksync-$img:scan" > "report-$img.txt" || true
            {
              echo "### stocksync-$img"
              echo '```'
              head -c 60000 "report-$img.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Fail on fixable CRITICAL vulnerabilities
        run: |
          for img in api frontend backup; do
            echo "== stocksync-$img"
            $TRIVY image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed \
              --ignorefile /src/.trivyignore --exit-code 1 "stocksync-$img:scan"
          done
