# =============================================================================
# Continuous Deployment to DigitalOcean Kubernetes.
#
# Automatic: when CI passes on a push to main (i.e. after a PR is merged), this
#   1. builds the API, frontend and backup images for linux/amd64,
#   2. pushes them to DigitalOcean Container Registry tagged with the commit,
#   3. backs up the database (restore point before any migration),
#   4. deploys them with k8s/deploy.sh (the same script used by hand); new API
#      pods apply pending database migrations in their init container,
#   5. verifies the live site: the running commit equals the deployed tag,
#      plus the smoke test.
#
# Manual (Actions -> CD -> Run workflow): deploy an EXISTING image tag without
# building, e.g. to roll back to an earlier commit. Leave the tag empty to
# rebuild and redeploy the current main.
#
# Needs, in the GitHub environment "production":
#   secret    DIGITALOCEAN_ACCESS_TOKEN   (scoped DigitalOcean API token)
#   variables DOCR_REGISTRY               (e.g. stocksync-sohaib)
#             CLUSTER_NAME                (e.g. stocksync)
# =============================================================================
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (git short SHA), e.g. for a rollback. Empty = build and deploy the current main."
        required: false
        default: ""

# One deployment at a time; a second one waits instead of cancelling the first.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, push and deploy to DOKS
    # Only after a successful CI run for a PUSH to main (not for pull requests),
    # or a manual run started from main.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://stocksync.online
    env:
      DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      REGISTRY: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}
      SITE_URL: https://stocksync.online

    steps:
      # Exactly the commit CI tested (not whatever main is by the time this runs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Decide what to deploy
        id: plan
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Deploying existing tag $INPUT_TAG (no build)"
          else
            tag="$(git rev-parse --short=7 HEAD)"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building and deploying $tag"
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Short-lived credentials: registry login and kubeconfig both expire.
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.build == 'true'

      - name: Build and push API image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          provenance: false      # plain image, no extra untagged attestation manifest
          tags: ${{ env.REGISTRY }}/stocksync-api:${{ steps.plan.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push frontend image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          provenance: false      # plain image, no extra untagged attestation manifest
          tags: ${{ env.REGISTRY }}/stocksync-frontend:${{ steps.plan.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build and push backup image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backup
          platforms: linux/amd64
          push: true
          provenance: false      # plain image, no extra untagged attestation manifest
          tags: ${{ env.REGISTRY }}/stocksync-backup:${{ steps.plan.outputs.tag }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: Check that all three images exist for this tag
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        # Ask the registry itself for each image manifest (authoritative, works
        # right after a push), with a few retries for registry propagation.
        run: |
          for repo in stocksync-api stocksync-frontend stocksync-backup; do
            ok=false
            for attempt in 1 2 3 4 5 6; do
              if docker manifest inspect "$REGISTRY/$repo:$TAG" > /dev/null 2>&1; then ok=true; break; fi
              echo "$repo:$TAG not visible yet (attempt $attempt), retrying in 5 s"; sleep 5
            done
            $ok || { echo "::error::$repo:$TAG not found in $REGISTRY"; exit 1; }
            echo "found $REGISTRY/$repo:$TAG"
          done

      - name: Connect to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1800 "$CLUSTER_NAME"

      - name: Record the version currently running (for rollback)
        run: |
          prev="$(kubectl -n stocksync get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')"
          echo "Previously running: $prev"
          echo "PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"

      # Restore point: if a migration in this release goes wrong, this backup
      # holds the data exactly as it was before (docs/operations.md).
      - name: Back up the database before deploying
        run: |
          job="predeploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl -n stocksync create job "$job" --from=cronjob/db-backup
          for i in $(seq 1 60); do
            ok="$(kubectl -n stocksync get job "$job" -o jsonpath='{.status.succeeded}')"
            failed="$(kubectl -n stocksync get job "$job" -o jsonpath='{.status.failed}')"
            [[ "$ok" == "1" ]] && break
            if [[ -n "$failed" && "$failed" -ge 3 ]]; then break; fi
            sleep 5
          done
          kubectl -n stocksync logs "job/$job" --tail=20 || true
          [[ "$ok" == "1" ]] || { echo "::error::Pre-deploy backup failed; not deploying"; exit 1; }

      - name: Deploy
        run: ./k8s/deploy.sh doks "${{ steps.plan.outputs.tag }}"

      # Proof that the NEW version is live: every answer must report the
      # deployed commit (several requests, so several API pods are asked).
      - name: Verify the live site runs this version
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          for i in $(seq 1 30); do
            good=0
            for n in 1 2 3 4 5 6; do
              curl -fsS "$SITE_URL/api/health" | grep -q "\"commit\":\"$TAG\"" && good=$((good+1))
            done
            [[ $good -eq 6 ]] && break
            echo "live commit not yet $TAG everywhere ($good/6), waiting ($i)"; sleep 5
          done
          curl -fsS "$SITE_URL/api/health"; echo
          [[ $good -eq 6 ]] || { echo "::error::Live site does not report commit $TAG"; exit 1; }
          API_URL="$SITE_URL" ./tests/smoke-day1.sh

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          {
            echo "### Deployment to DOKS"
            echo "| | |"; echo "|---|---|"
            echo "| Deployed tag | \`$TAG\` |"
            echo "| Live commit | \`$(curl -fsS "$SITE_URL/api/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')\` |"
            echo "| Previous tag | \`${PREVIOUS_TAG:-unknown}\` |"
            echo "| Built in this run | ${{ steps.plan.outputs.build }} |"
            echo "| Site | $SITE_URL |"
            echo ""
            echo "Roll back: Actions -> CD -> Run workflow -> tag \`${PREVIOUS_TAG:-<previous tag>}\`"
            echo ""
            echo '```'
            kubectl -n stocksync get deploy,hpa,cronjob 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
